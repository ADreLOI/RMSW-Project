[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmsw-usv-sim"
version = "0.1.0"
description = "Reproducible two-USV coverage and intermittent-link experiment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "psutil>=5.9,<8"]

[project.optional-dependencies]
deploy = ["aiohttp>=3.12,<4"]

[project.scripts]
usv-experiment = "usv_sim.experiment:main"
usv-analyze = "usv_sim.analysis:main"
usv-dashboard = "usv_sim.dashboard:main"
usv-workflow = "usv_sim.workflow:main"

[tool.setuptools]
packages = ["usv_sim", "usv_sim.charts", "usv_sim.extensions", "webapp"]
package-dir = {usv_sim = "simulator/usv_sim", webapp = "webapp"}

[tool.setuptools.package-data]
webapp = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/fonts/*"]
