name: Simulator checks
on:
  push:
    branches: [main, dev, 'dev-code**']
  pull_request:
    branches: [main, dev, 'dev-code**']

jobs:
  tests:
    name: Simulator tests and five reference missions
    if: github.event_name != 'pull_request' || github.head_ref != 'dev-paper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./code
      - name: Tests, paired simulation, figures and evidence archive
        run: python -m usv_sim.workflow --preset smoke --output code/simulator/results/ci-smoke
      - name: Compare deterministic scientific results with retained evidence
        run: python -m usv_sim.verify code/simulator/results/ci-smoke --reference code/simulator/results/core
      - run: python -c "from usv_sim.analysis import reconstruct; result, _ = reconstruct('code/simulator/examples/trend-seed1000-slowdown-L5.jsonl.gz'); assert result['complete']"
      - name: Retain reproducible evidence and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-smoke-evidence
          path: code/simulator/results/ci-smoke/evidence.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

  deployed-lab:
    name: Lab integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    if: github.event_name != 'pull_request' || github.head_ref != 'dev-paper'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LAB_ENGINE_KEY: ci-isolated-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "aiohttp>=3.12,<4"
      - name: Build and start the web and engine containers
        if: runner.os == 'Linux'
        run: docker compose up --build -d --wait --wait-timeout 90
      - name: Start the native Windows lab
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LAB_PYTHON = (Get-Command python).Source
          .\Manage-Lab.cmd -Action start -Mode native -Services both -NoBrowser
      - name: Check live data, jobs, replay and downloads
        if: runner.os == 'Windows'
        run: python code/webapp/tests/check_stack.py
      - name: Install Chromium and run API and browser checks
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          python code/webapp/tests/check_stack.py --browser
      - if: always() && runner.os == 'Linux'
        run: |
          docker compose logs --tail 50
          docker compose down
      - if: always() && runner.os == 'Windows'
        run: .\Manage-Lab.cmd -Action stop -Mode native -Services both
