name: Simulator checks and publication
on:
  push:
    branches: [main, dev, 'dev-code**']
  pull_request:
    branches: [main, dev, 'dev-code**']

permissions:
  contents: read

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Simulator tests and five reference missions
    if: github.event_name != 'pull_request' || github.head_ref != 'dev-paper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './code[deploy]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Relay authentication, streaming and engine integration
        run: python -m unittest discover -s code/webapp/tests -v
      - name: Browser connection transport
        run: node --test code/webapp/tests/connection.test.cjs
      - name: Tests, paired simulation, figures and evidence archive
        run: python -m usv_sim.workflow --preset smoke --output code/simulator/results/ci-smoke
      - name: Compare deterministic scientific results with retained evidence
        run: python -m usv_sim.verify code/simulator/results/ci-smoke --reference code/simulator/results/core
      - run: python -c "from usv_sim.analysis import reconstruct; result, _ = reconstruct('code/simulator/examples/trend-seed1000-slowdown-L5.jsonl.gz'); assert result['complete']"
      - name: Build public site from verified evidence
        env:
          LAB_RELAY_URL: ${{ vars.LAB_RELAY_URL }}
        run: python -m webapp.build_pages --output .pages-artifact --demo-bundle code/simulator/results/ci-smoke --relay-url "$LAB_RELAY_URL"
      - name: Package Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-artifact
      - name: Retain reproducible evidence and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-smoke-evidence
          path: code/simulator/results/ci-smoke/evidence.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

  pages:
    name: Publish GitHub Pages
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  relay:
    name: Request Render deploy of the tested commit
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Invoke private Render hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: python code/webapp/request_deploy.py
