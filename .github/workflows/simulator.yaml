name: Simulator checks
on:
  push:
    branches: [main, dev, 'dev-code**']
  pull_request:
    branches: [main, dev, 'dev-code**']

jobs:
  tests:
    name: Simulator tests and five reference missions
    if: github.event_name != 'pull_request' || github.head_ref != 'dev-paper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./code
      - name: Tests, paired simulation, figures and evidence archive
        run: python -m usv_sim.workflow --preset smoke --output code/simulator/results/ci-smoke
      - name: Compare deterministic scientific results with retained evidence
        run: python -m usv_sim.verify code/simulator/results/ci-smoke --reference code/simulator/results/core
      - run: python -c "from usv_sim.analysis import reconstruct; result, _ = reconstruct('code/simulator/examples/trend-seed1000-slowdown-L5.jsonl.gz'); assert result['complete']"
      - name: Retain reproducible evidence and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-smoke-evidence
          path: code/simulator/results/ci-smoke/evidence.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
