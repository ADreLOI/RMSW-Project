name: Simulator checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e code/simulation
      - name: Tests, paired simulation, figures and evidence archive
        run: python -m usv_sim.workflow --preset smoke --output code/simulation/results/ci-smoke
      - name: Compare deterministic scientific results with retained evidence
        run: python -m usv_sim.verify code/simulation/results/ci-smoke --reference code/simulation/results/core
      - run: python -c "from usv_sim.analysis import reconstruct; result, _ = reconstruct('code/simulation/examples/trend-seed1000-slowdown-L5.jsonl.gz'); assert result['complete']"
      - name: Retain reproducible evidence and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-smoke-evidence
          path: code/simulation/results/ci-smoke/evidence.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn
