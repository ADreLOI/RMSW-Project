name: Simulator checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e code/simulation
      - name: Tests, paired simulation, figures and evidence archive
        run: python -m usv_sim.workflow --preset smoke --output code/simulation/results/ci-smoke
      - name: Compare deterministic scientific results with retained evidence
        run: python -m usv_sim.verify code/simulation/results/ci-smoke --reference code/simulation/results/core
      - run: python -c "from usv_sim.analysis import reconstruct; result, _ = reconstruct('code/simulation/examples/trend-seed1000-slowdown-L5.jsonl.gz'); assert result['complete']"
      - name: Retain reproducible evidence and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-smoke-evidence
          path: code/simulation/results/ci-smoke/evidence.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

  deployed-lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LAB_ENGINE_KEY: ci-isolated-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "aiohttp>=3.12,<4"
      - if: runner.os == 'Linux'
        run: docker compose up --build -d --wait --wait-timeout 90
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LAB_PYTHON = (Get-Command python).Source
          .\Run-Lab.cmd -Action start -Mode native -Services both -NoBrowser
      - if: runner.os == 'Windows'
        run: python code/deploy/check_stack.py
      - if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          python code/deploy/check_stack.py --browser
      - if: always() && runner.os == 'Linux'
        run: |
          docker compose logs --tail 50
          docker compose down
      - if: always() && runner.os == 'Windows'
        run: .\Run-Lab.cmd -Action stop -Mode native -Services both
